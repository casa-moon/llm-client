[package]
name = "llm_client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "1"
inquire = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
dotenvy = "0.15"
parking_lot = "0.12"
dialoguer = "0.11"
owo-colors = "4"
termimad = "0.28"

# HTTP client for provider integrations (blocking for simplicity)
reqwest = { version = "0.12", features = ["json", "gzip", "blocking", "rustls-tls"] }
scraper = "0.19"
url = "2"
walkdir = "2"
git2 = { version = "0.18", default-features = false, features = ["https"] }
calamine = "0.22"
pdf-extract = "0.7"
tiktoken-rs = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "ico", "tiff", "webp"] }
lopdf = "0.32"
base64 = "0.22"
flate2 = "1"
indicatif = "0.17"
